name: Check *.tsv
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tsvlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt install libtext-csv-perl
      - name: Check locales/*/*.tsv
        run: |
          for f in locales/*/*.tsv
          do
            printf '%s' "$f"
            cat "$f" | perl .github/workflows/tsvlint.pl
          done
